<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="Game.css">
</head>
<body>

    <div class="game-container">
        <h1>Number Guessing Game</h1>
        <p id="message">Want to play? Click Start below!</p>
        
        <!-- Controls wrapped in a div for easy hiding/showing -->
        <div id="setup-section">
            <button id="start-btn">Start Game</button>
        </div>

        <div id="play-section" style="display: none;">
            <input type="number" id="guess-input" placeholder="Enter 1 - 20" min="1" max="20">
            <button id="submit-btn">Guess</button>
        </div>
    </div>

    <!-- Container for holding the sparkles when you win -->
    <div id="sparkle-container"></div>

    <script src="Game.js"></script>
</body>
</html>
